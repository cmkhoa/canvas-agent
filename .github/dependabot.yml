version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # 1.26+ raises the MSRV above the pinned Rust 1.88 toolchain.
      - dependency-name: "uuid"
        versions: [">=1.19.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The action ref is a toolchain selector (see ci.yml), not a semver action version.
      - dependency-name: "dtolnay/rust-toolchain"
      # Replaced by cargo-deny; keep the security workflow free of a dependency-graph dependency.
      - dependency-name: "actions/dependency-review-action"
