[package]
name = "canvas-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Canvas Academic Planner: a deterministic planning agent over canvas-mcp"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "canvas_agent"
path = "src/lib.rs"

[[bin]]
name = "canvas-planner"
path = "src/bin/canvas-planner.rs"

[[bin]]
name = "canvas-eval"
path = "src/bin/canvas-eval.rs"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
clap = { version = "=4.6.7", features = ["derive", "env"] }
dotenvy = "=0.15.7"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
wiremock = "=0.6.5"

[profile.release]
lto = "thin"
strip = "symbols"
